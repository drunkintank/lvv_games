<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LVV Games — мини-игры в Telegram</title>
<meta name="description" content="LVV Games — мини-игры прямо в Telegram: без скачивания, на телефоне и компьютере. Чёрная арена и новые игры.">
<meta property="og:title" content="LVV Games — мини-игры в Telegram">
<meta property="og:description" content="Играй прямо в Telegram: без скачивания, бей рекорды и соревнуйся с друзьями.">
<meta property="og:image" content="https://drunkintank.github.io/lvv_games/img/og.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#16123f">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Onest:wght@400;600;800&display=swap">
<style>
/* Layout: one narrow column (phone-first, centred on desktop): brand header, game cards, footer actions. One fixed look: the LVV Games night-violet brand. */
:root{
  --bg:#16123f;
  --bg-deep:#0a0a1f;
  --card:rgba(255,255,255,.06);
  --line:rgba(190,180,255,.18);
  --ink:#f3f1ff;
  --dim:#aaa6d6;
  --cyan:#5fd6ff;
  --violet:#b07dff;
  --pink:#ff7ab0;
  --neon:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));
  --display:'Russo One','Arial Black',system-ui,sans-serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg-deep)}
body{
  margin:0;min-height:100vh;color:var(--ink);font:16px/1.45 var(--body);
  background:radial-gradient(120% 60% at 80% 0%,rgba(176,125,255,.28),transparent 60%),linear-gradient(180deg,#2a1a6e 0%,var(--bg) 38%,var(--bg-deep) 100%);
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:22px}
header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.logo{width:56px;height:56px;border-radius:16px;display:block}
.brand{display:grid;gap:2px;min-width:0}
.brand h1{margin:0;font:400 26px/1 var(--display);letter-spacing:.04em;background:var(--neon);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:0;color:var(--dim);font-size:14px}
.lang{border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:12px;height:40px;padding:0 12px;font:600 13px var(--body);letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.lang b{color:var(--ink)}
.lang:focus-visible,.play:focus-visible,.friends:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hello{margin:0;font:600 19px/1.3 var(--body);text-wrap:balance}
.hello span{color:var(--dim);font-weight:400;display:block;font-size:15px;margin-top:4px}
.section{display:grid;gap:12px}
.section h2{margin:0;font:600 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.game{position:relative;border-radius:22px;overflow:hidden;background:var(--bg-deep);border:1px solid var(--line);display:grid}
.game .cover{aspect-ratio:16/9;width:100%;max-width:100%;display:block;object-fit:cover}
.game .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(10,10,31,.92) 72%)}
.game .info{position:absolute;left:0;right:0;bottom:0;padding:16px;display:grid;gap:8px}
.game h3{margin:0;font:400 24px/1.05 var(--display)}
.game .tag{margin:0;color:#d7d4f5;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.best{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.best b{color:var(--ink);font-family:var(--display);font-weight:400;font-size:16px}
.play{border:0;border-radius:14px;padding:12px 22px;font:800 16px var(--body);color:#140f35;background:var(--neon);cursor:pointer;text-decoration:none;white-space:nowrap}
.game.live:active{transform:scale(.99)}
.soon{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.soon .card{border-radius:18px;border:1px dashed var(--line);background:var(--card);aspect-ratio:4/3;display:grid;place-items:center;text-align:center;padding:12px;color:var(--dim);font-size:14px}
.soon .q{font:400 34px/1 var(--display);color:rgba(255,255,255,.25);display:block;margin-bottom:6px}
.friends{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px 16px;font:600 16px var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
footer{color:var(--dim);font-size:12px;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .game.live .cover{transition:transform .6s ease}
  .game.live:hover .cover{transform:scale(1.03)}
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true">
      <defs>
        <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1a6e"/><stop offset="1" stop-color="#0a0a1f"/></linearGradient>
        <linearGradient id="lne" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fd6ff"/><stop offset=".5" stop-color="#b07dff"/><stop offset="1" stop-color="#ff7ab0"/></linearGradient>
      </defs>
      <rect width="1024" height="1024" rx="230" fill="url(#lbg)"/>
      <g transform="translate(512 520) scale(1.25)">
        <path d="M-250 -60 C-250 -140 -190 -170 -120 -170 L120 -170 C190 -170 250 -140 250 -60 L282 120 C296 200 230 240 178 196 L110 130 L-110 130 L-178 196 C-230 240 -296 200 -282 120 Z" fill="#f3f1ff" stroke="url(#lne)" stroke-width="16"/>
        <rect x="-178" y="-62" width="104" height="34" rx="10" fill="#16123f"/><rect x="-143" y="-97" width="34" height="104" rx="10" fill="#16123f"/>
        <circle cx="118" cy="-82" r="24" fill="#5fd6ff"/><circle cx="170" cy="-30" r="24" fill="#ff7ab0"/><circle cx="66" cy="-30" r="24" fill="#ffd166"/><circle cx="118" cy="22" r="24" fill="#7dff8a"/>
      </g>
    </svg>
    <div class="brand"><h1>LVV GAMES</h1><p id="tagline">Мини-игры прямо в Telegram</p></div>
    <button class="lang" id="langBtn" aria-label="Language / Язык"></button>
  </header>

  <p class="hello" id="hello"></p>

  <section class="section" aria-labelledby="gamesH">
    <h2 id="gamesH">Игры</h2>
    <div id="games" class="section"></div>
  </section>

  <section class="section" aria-labelledby="soonH">
    <h2 id="soonH">Скоро</h2>
    <div class="soon" id="soon"></div>
  </section>

  <button class="friends" id="friendsBtn"><span aria-hidden="true">👥</span><span id="friendsTxt">Позвать друзей</span></button>
  <footer id="foot">LVV Games · без скачивания · телефон и компьютер</footer>
</main>

<script>
(() => {
const $ = id => document.getElementById(id);
const BOT_LINK = 'https://t.me/lvv_game';

// ---------- the catalog: add a new game with one entry ----------
const GAMES = [
  {
    id:'arena', url:'arena/', cover:'img/arena.png', bestKey:'arena.best',
    title:{ ru:'Чёрная арена', en:'Black Arena' },
    text:{ ru:'Управляй чёрной дырой: глотай машины, дома и небоскрёбы и затягивай соперников поменьше.', en:'Control a black hole: swallow cars, houses and skyscrapers and pull in smaller rivals.' },
    chips:{ ru:['3D','аркада','рекорды друзей'], en:['3D','arcade','friends’ records'] },
  },
  {
    id:'office', url:'office/', cover:'img/office.png', bestKey:'office.best',
    title:{ ru:'Офисный снайпер', en:'Office Sniper' },
    text:{ ru:'Закидывай бумажки в корзину через перегородки и лампы, целься шефу в лысину и устраивай разнос офиса.', en:'Toss paper balls past glass walls and lamps, aim for the boss’s bald spot and smash the office.' },
    chips:{ ru:['аркада','5 локаций','бонусы'], en:['arcade','5 locations','power-ups'] },
  },
];
const SOON = 1; // placeholder cards for upcoming games

const T = {
  ru:{ tagline:'Мини-игры прямо в Telegram', games:'Игры', soon:'Скоро', soonCard:'Новая игра в разработке', play:'Играть', best:'Твой рекорд', noBest:'Ещё не играл', friends:'Позвать друзей', foot:'LVV Games · без скачивания · телефон и компьютер',
        hello:n => n ? `Привет, ${n}!` : 'Привет!', helloSub:'Выбирай игру и бей рекорды.', share:'Залетай в LVV Games — мини-игры прямо в Telegram. Побей мой рекорд!', copied:'Ссылка скопирована' },
  en:{ tagline:'Mini games right in Telegram', games:'Games', soon:'Coming soon', soonCard:'New game in the works', play:'Play', best:'Your best', noBest:'Not played yet', friends:'Invite friends', foot:'LVV Games · no download · phone and desktop',
        hello:n => n ? `Hi, ${n}!` : 'Hi!', helloSub:'Pick a game and set a record.', share:'Join me in LVV Games — mini games right in Telegram. Beat my record!', copied:'Link copied' },
};

// ---------- Telegram ----------
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const tgv = v => { try { return !!tg && tg.isVersionAtLeast(v); } catch(e){ return false; } };
const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
if (tg){
  try { tg.ready(); tg.expand(); } catch(e){}
  if (tgv('6.1')) try { tg.setHeaderColor('#2a1a6e'); tg.setBackgroundColor('#16123f'); } catch(e){}
  if (tgv('7.10')) try { tg.setBottomBarColor('#0a0a1f'); } catch(e){}
}
const haptic = () => { if (tgv('6.1')) try { tg.HapticFeedback.impactOccurred('light'); } catch(e){} };

// ---------- storage (shared with the games: same site, same bot cloud) ----------
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, v); } catch(e){} } };
const cloudOK = !!(tg && tg.initData) && tgv('6.9');

// ---------- language: saved choice, then Telegram profile, then browser ----------
const pick = code => String(code || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';
let lang = T[ls.get('arena.lang')] ? ls.get('arena.lang') : pick((user && user.language_code) || navigator.language);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
function render(){
  const L = T[lang];
  document.documentElement.lang = lang;
  $('tagline').textContent = L.tagline;
  $('gamesH').textContent = L.games;
  $('soonH').textContent = L.soon;
  $('friendsTxt').textContent = L.friends;
  $('foot').textContent = L.foot;
  $('langBtn').innerHTML = lang === 'ru' ? '<b>RU</b> · EN' : 'RU · <b>EN</b>';
  const name = user && (user.first_name || user.username);
  $('hello').innerHTML = `${esc(L.hello(name))}<span>${esc(L.helloSub)}</span>`;
  $('games').innerHTML = GAMES.map(g => {
    const best = +ls.get(g.bestKey) || 0;
    return `<article class="game live" data-id="${g.id}">
      <img class="cover" src="${g.cover}" alt="${esc(g.title[lang])}" width="640" height="360">
      <div class="shade"></div>
      <div class="info">
        <h3>${esc(g.title[lang])}</h3>
        <p class="tag">${esc(g.text[lang])}</p>
        <div class="chips">${g.chips[lang].map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>
        <div class="row">
          <span class="best">${best ? `${L.best}: <b>${best}</b>` : L.noBest}</span>
          <a class="play" href="${g.url}?from=hub">${L.play} ▶</a>
        </div>
      </div>
    </article>`;
  }).join('');
  $('soon').innerHTML = Array.from({ length:SOON }, () => `<div class="card"><div><span class="q">?</span>${L.soonCard}</div></div>`).join('');
}

$('langBtn').onclick = () => {
  lang = lang === 'ru' ? 'en' : 'ru';
  ls.set('arena.lang', lang);
  if (cloudOK) try { tg.CloudStorage.setItem('arena.lang', lang); } catch(e){}
  haptic(); render();
};
// the whole card is a tap target, not only the button
document.addEventListener('click', e => {
  const card = e.target.closest('.game.live');
  if (!card) return;
  haptic();
  if (!e.target.closest('a')){ const a = card.querySelector('a.play'); if (a) location.href = a.href; }
});
$('friendsBtn').onclick = () => {
  haptic();
  const text = T[lang].share;
  if (tgv('6.1')){ try { tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(BOT_LINK) + '&text=' + encodeURIComponent(text)); return; } catch(e){} }
  if (navigator.share){ navigator.share({ title:'LVV Games', text, url:BOT_LINK }).catch(() => {}); return; }
  const done = () => { $('friendsTxt').textContent = T[lang].copied; setTimeout(() => { $('friendsTxt').textContent = T[lang].friends; }, 1800); };
  try { navigator.clipboard.writeText(text + ' ' + BOT_LINK).then(done, done); } catch(e){ done(); }
};

render();
// records and language live in Telegram's cloud too: refresh once they arrive
if (cloudOK){
  try {
    const keys = ['arena.lang', ...GAMES.map(g => g.bestKey)];
    tg.CloudStorage.getItems(keys, (err, vals) => {
      if (err || !vals) return;
      for (const k of keys) if (vals[k]) ls.set(k, vals[k]);
      if (T[vals['arena.lang']]) lang = vals['arena.lang'];
      render();
    });
  } catch(e){}
}
})();
</script>
</body>
</html>
